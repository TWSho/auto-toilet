; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_dir = C:/tmp/pio-build/auto-toilet

[env:m5stack-stamps3]
; 実機はM5StampS3A(2026年発売の後継モジュール)。ESP32-S3FN8/8MBフラッシュ/PSRAMなしという
; チップ構成は無印StampS3と同一で、pioarduino/PlatformIOにStampS3A専用のboard定義が
; まだ存在しないため、引き続き"m5stack-stamps3"のboard定義を流用する。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	m5stack/M5Unified @ ^0.2.2
	ncmreynolds/ld2410
	https://github.com/m5stack/M5Unit-AudioPlayer.git
	crankyoldgit/IRremoteESP8266 @ ^2.9.0
	knolleary/PubSubClient @ ^2.8
	bblanchon/ArduinoJson @ ^7.2
	ESP32Async/ESPAsyncWebServer @ ^3.7
	ESP32Async/AsyncTCP @ ^3.3
board_build.filesystem = littlefs
